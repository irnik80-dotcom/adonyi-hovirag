name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: D1 adatbázis létrehozása, ha még nincs
        run: |
          if ! npx wrangler d1 info hovirag --json > info.json 2>/dev/null; then
            npx wrangler d1 create hovirag
            npx wrangler d1 info hovirag --json > info.json
          fi
          ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' info.json | head -1)
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml

      - name: Adatbázis séma (ismételhető, nem töröl semmit)
        run: npx wrangler d1 execute hovirag --remote --file=schema.sql

      - name: Kitelepítés
        run: npx wrangler deploy

      - name: Jelszó és munkamenet-titok beállítása
        run: |
          node -e 'console.log(JSON.stringify({ADMIN_PASSWORD:process.env.ADMIN_PASSWORD,SESSION_SECRET:process.env.SESSION_SECRET}))' | npx wrangler secret bulk
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
