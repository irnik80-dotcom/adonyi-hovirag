name = "adonyi-hovirag"
main = "src/worker.js"
compatibility_date = "2025-01-01"
# a Cloudflare felületén megadott titkok és változók maradjanak meg telepítéskor
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hovirag"
# A database_id a Cloudflare felületén a D1 adatbázis oldalán látszik.
database_id = "9d6407db-a06e-45c8-bae2-bf30e745a3c0"

[version_metadata]
binding = "CF_VERSION_METADATA"

# UTC 01:15: napi automatikus biztonsági mentés; UTC 06:00: névnap-értesítés (és pótmentés, ha kell)
[triggers]
crons = ["15 1 * * *", "0 6 * * *"]
